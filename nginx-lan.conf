events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  # The browser talks to this gateway with a same-origin /api request.
  proxy_set_header Origin "";

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://backend:3000;
    }

    location / {
      proxy_pass http://client:80;
    }
  }

  server {
    listen 81;
    server_name _;

    location /api/ {
      proxy_pass http://backend:3000;
    }

    location / {
      proxy_pass http://admin:80;
    }
  }

  server {
    listen 443 ssl;
    server_name reservation;

    ssl_certificate /etc/nginx/certs/reservation.pem;
    ssl_certificate_key /etc/nginx/certs/reservation-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
      proxy_pass http://backend:3000;
    }

    location / {
      proxy_pass http://client:80;
    }
  }

  server {
    listen 443 ssl;
    server_name admin.reservation;

    ssl_certificate /etc/nginx/certs/reservation.pem;
    ssl_certificate_key /etc/nginx/certs/reservation-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
      proxy_pass http://backend:3000;
    }

    location / {
      proxy_pass http://admin:80;
    }
  }

  # Direct-IP HTTPS access for the admin panel. The customer app uses 8443;
  # the separate port avoids relying on a DNS hostname to choose the upstream.
  server {
    listen 444 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/reservation.pem;
    ssl_certificate_key /etc/nginx/certs/reservation-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
      proxy_pass http://backend:3000;
    }

    location / {
      proxy_pass http://admin:80;
    }
  }
}
